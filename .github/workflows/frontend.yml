name: frontend

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calidad:
    name: Lint, pruebas y compilación
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.4.0
        with:
          # Angular 22 exige Node ^22.22.3 o ^24.15.0 (campo "engines" de package.json).
          node-version: "24"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run test:ci
      - run: npm run build:prod
