<section class="enlace" aria-live="polite">
  <app-vex [estado]="estadoVex()" tamano="md" />

  @switch (vista()) {
    @case ('cargando') {
      <h1>{{ textos.titulo }}</h1>
      <p role="status">{{ textos.cargando }}</p>
      <button app-boton type="button" variante="primario" [disabled]="true" [cargando]="true">
        {{ textos.continuar }}
      </button>
    }
    @case ('listo') {
      <h1>{{ textos.listo }}</h1>
      <button app-boton type="button" variante="primario" (click)="continuar()">
        {{ usuario() ? textos.continuar : textos.ingresar }}
      </button>
    }
    @case ('invalido') {
      <h1>{{ textos.titulo }}</h1>
      <div class="alerta alerta--aviso" role="status">
        <app-icono class="alerta__icono" nombre="info" />
        <p class="alerta__cuerpo">{{ textos.invalido }}</p>
      </div>
      <button app-boton type="button" variante="primario" (click)="continuar()">
        {{ textos.ingresar }}
      </button>
    }
    @case ('error') {
      <h1>{{ textos.titulo }}</h1>
      <div class="alerta alerta--error" role="alert">
        <app-icono class="alerta__icono" nombre="alerta" />
        <p class="alerta__cuerpo">{{ textos.neutro }}</p>
      </div>
      <button app-boton type="button" variante="primario" (click)="verificar()">
        {{ textos.reintentar }}
      </button>
    }
  }
</section>
